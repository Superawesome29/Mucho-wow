<!DOCTYPE html>
<html>
<head>
    <title>Study Session Portal</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #111; color: #fff; }
        #header-cloak { background: #222; padding: 10px; text-align: center; font-weight: bold; border-bottom: 2px solid #333; height: 24px; line-height: 24px; }
        iframe { width: 100%; height: calc(100% - 44px); border: none; }
    </style>
</head>
<body>
    <div id="header-cloak">📐 Math Homework Helper — Algebra Section 📐</div>

    <script type="module">
        // 1. Load Scramjet's setup code from our server path
        import '/scram/scramjet.all.js';

        // 2. Turn on the background traffic controller
        const worker = await ScramjetController.register();

        // 3. Set the target website you want to load
        const targetUrl = 'https://deeeep.io';
        
        // 4. Encode the link so network filters can't read the plain text
        const proxyUrl = '/service/' + btoa(targetUrl);

        // 5. Create the full-screen view area and display the game
        const iframe = document.createElement('iframe');
        iframe.src = proxyUrl;
        document.body.appendChild(iframe);
    </script>
</body>
</html>
